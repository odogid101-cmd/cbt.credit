<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Credit - Practice Mode</title>
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="pract.css">
</head>
<body>
  <!-- theme will still apply from localStorage, but no floating card -->
  <script>
    // Just apply saved theme
    const theme = localStorage.getItem('cbt_theme_mode') || 'normal';
    if (theme === 'light') document.body.classList.add('light-mode');
    if (theme === 'dark') document.body.classList.add('dark-mode');
  </script>
  <div class="toast-container" id="toastContainer"></div>

  <div class="header">
    <div class="circle3" onclick="location.href='home.html'">
      <img src="https://i.postimg.cc/KYJMWhQw/1000324996-removebg-preview.png" alt="Back">
    </div>
    <div class="title">Practice Mode</div>
  </div>

  <section class="section">
    <h2>Select Subjects</h2>
    <div class="subject-list" id="subjectList"></div>
  </section>

  <section class="section">
    <h2>Practice Settings</h2>
    <div class="settings-card">
      <div class="setting-row">
        <label>Time Duration</label>
        <div class="time-inputs">
          <div class="picker-field" id="hoursField">
            <span id="hoursValue">1 Hr</span>
          </div>
          <div class="picker-field" id="minutesField">
            <span id="minutesValue">30 Mins</span>
          </div>
        </div>
      </div>

      <div class="setting-row">
        <label>Exam Mode</label>
        <div class="picker-field" id="examModeField">
          <span id="examModeValue">JAMB UTME</span>
        </div>
      </div>
    </div>
  </section>

  <button class="btn proceed-btn" id="proceedBtn"><h3>Proceed</h3></button>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-card">
      <h3>Confirm Your Practice</h3>
      <div id="confirmDetails"></div>
      <div class="modal-buttons">
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn" id="startBtn">Start Practice</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="pickerModal">
    <div class="modal-card picker-card">
      <h3 id="pickerTitle">Select Hour</h3>
      <div class="picker-list" id="pickerList"></div>
      <div class="modal-buttons">
        <button class="btn btn-secondary" id="pickerCloseBtn">Close</button>
        <button class="btn" id="pickerSetBtn">Set</button>
      </div>
    </div>
  </div>

  <script type="module" src="pract.js"></script>
</body>
</html>
