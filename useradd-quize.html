<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Quiz Manager</title>
<style>
:root {
  --primary: #10b981; --primary-dark: #059669; --accent: #6ee7b7;
  --bg: linear-gradient(135deg, #064e3b, #065f46, #047857);
  --text: #ecfdf5; --card-bg: rgba(255, 255, 255, 0.12);
  --glass-border: rgba(110, 231, 183, 0.3); --radius-lg: 20px;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: system-ui, Arial, sans-serif; padding: 20px;
}
.card {
  max-width: 700px; margin: 30px auto; background: var(--card-bg);
  backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
  padding: 30px; border-radius: var(--radius-lg);
}
input, textarea {
  width: 100%; padding: 12px; margin: 8px 0; border-radius: 15px;
  border: 1px solid var(--glass-border); background: rgba(16,185,129,0.15); color: var(--text);
}
button {
  width: 100%; padding: 12px; border-radius: 15px; border: none;
  background: var(--primary); color: #fff; cursor: pointer; margin-top: 10px; font-weight: 600;
}
button:hover { background: var(--primary-dark); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.hidden { display: none!important; }
.success { color: var(--accent); text-align: center; }
.error { color: #fca5a5; text-align: center; }
.top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 10px; }
</style>
</head>
<body>

<!-- AUTH SECTION -->
<div id="auth_section">
  <div class="card">
    <h2 id="auth_title">Login</h2>
    <div id="login_form">
      <input type="text" id="login_identifier" placeholder="Username or Email">
      <input type="password" id="login_password" placeholder="Password">
      <button id="login_btn" onclick="login()">Login</button>
      <div style="text-align:center;margin-top:12px;">
        <a href="admin-forget.html" style="color:#6ee7b7;">Forgot Password?</a> |
        <a onclick="showRegister()" style="color:#6ee7b7;cursor:pointer;">Create Account</a>
      </div>
    </div>

    <div id="register_form" class="hidden">
      <input type="text" id="reg_username" placeholder="Username">
      <input type="email" id="reg_email" placeholder="Email">
      <input type="password" id="reg_password" placeholder="Password">
      <button id="register_btn" onclick="register()">Create Account</button>
      <div style="text-align:center;margin-top:12px;">
        Already have an account? <a onclick="showLogin()" style="color:#6ee7b7;cursor:pointer;">Login</a>
      </div>
    </div>

    <div id="auth_message"></div>
  </div>
</div>

<!-- NOT PAID SECTION -->
<div id="not_paid_section" class="hidden">
  <div class="card">
    <h2>Subscription Required</h2>
    <p>You need an active subscription to access the quiz creator.</p>
    <button onclick="location.href='payment.html'">Go to Payment</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<!-- ADMIN PANEL SECTION -->
<div id="admin_panel" class="hidden">
  <div class="top-bar">
    <h3 id="welcome_user">Welcome</h3>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h2>Bulk Add Questions</h2>
    <input type="text" id="quiz_title" placeholder="Quiz Title">

    <p>Paste questions. One question per block, separate blocks with <code>---</code></p>
    <textarea id="bulk_questions" rows="15" placeholder="Question text here
A. Option 1
B. Option 2
C. Option 3
D. Option 4
Answer: A
---
Next question here
A. Lagos
B. Abuja
C. Kano
D. Port Harcourt
Answer: B"></textarea>

    <button id="bulk_btn" onclick="addBulkQuestions()">Add All Questions</button>
    <div id="bulk_msg"></div>
  </div>
</div>

<script src="configQuiz.js"></script>
<script>
let USER_ID = localStorage.getItem('user_id') || null;
let USERNAME = localStorage.getItem('username') || null;
let SUB_STATUS = localStorage.getItem('sub_status') || null;
let ROLE = localStorage.getItem('role') || 'user';

window.onload = function() {
  if (!USER_ID) {
    showAuth();
    return;
  }
  checkAccess();
}

function showAuth() {
  document.getElementById('auth_section').classList.remove('hidden');
  document.getElementById('not_paid_section').classList.add('hidden');
  document.getElementById('admin_panel').classList.add('hidden');
}

function showRegister() {
  document.getElementById('login_form').classList.add('hidden');
  document.getElementById('register_form').classList.remove('hidden');
  document.getElementById('auth_title').innerText = 'Create Account';
}

function showLogin() {
  document.getElementById('login_form').classList.remove('hidden');
  document.getElementById('register_form').classList.add('hidden');
  document.getElementById('auth_title').innerText = 'Login';
}

async function login() {
  const btn = document.getElementById('login_btn');
  btn.disabled = true;
  btn.innerText = 'Logging in...';

  try {
    const identifier = document.getElementById('login_identifier').value.trim();
    const password = document.getElementById('login_password').value.trim();

    const res = await fetch(`${CONFIG.API_URL}/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ login: identifier, password })
    });
    const data = await res.json();

    if (res.ok) {
      USER_ID = data.user_id;
      USERNAME = data.user.username;
      SUB_STATUS = data.subscription_status;
      ROLE = data.user.role || 'user';
      
      localStorage.setItem('user_id', USER_ID);
      localStorage.setItem('username', USERNAME);
      localStorage.setItem('sub_status', SUB_STATUS);
      localStorage.setItem('role', ROLE);
      
      checkAccess();
    } else {
      if (data.subscription_status === 'inactive' || data.subscription_status === 'expired') {
        localStorage.setItem('user_id', data.user_id || USER_ID);
        localStorage.setItem('email', identifier);
        localStorage.setItem('amount', data.amount);
        location.href = 'payment.html';
      } else {
        showAuthMessage(data.error || 'Login failed', 'error');
      }
    }
  } catch (err) {
    showAuthMessage('Network error', 'error');
  }
  btn.disabled = false;
  btn.innerText = 'Login';
}

async function register() {
  const btn = document.getElementById('register_btn');
  btn.disabled = true;
  btn.innerText = 'Creating...';
  
  try {
    const username = document.getElementById('reg_username').value.trim();
    const email = document.getElementById('reg_email').value.trim();
    const password = document.getElementById('reg_password').value.trim();

    const res = await fetch(`${CONFIG.API_URL}/register`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('user_id', data.user_id);
      localStorage.setItem('email', email);
      localStorage.setItem('amount', data.amount);
      showAuthMessage('Account created! Redirecting to payment...', 'success');
      setTimeout(() => { location.href = 'payment.html'; }, 1500);
    } else {
      showAuthMessage(data.error || 'Registration failed', 'error');
    }
  } catch (err) {
    showAuthMessage('Network error', 'error');
  }
  btn.disabled = false;
  btn.innerText = 'Create Account';
}

function checkAccess() {
  if (ROLE === 'admin' || SUB_STATUS === 'active') {
    showAdminPanel();
  } else {
    showNotPaid();
  }
}

function showAdminPanel() {
  document.getElementById('auth_section').classList.add('hidden');
  document.getElementById('not_paid_section').classList.add('hidden');
  document.getElementById('admin_panel').classList.remove('hidden');
  document.getElementById('welcome_user').innerText = `Welcome, ${USERNAME}`;
}

function showNotPaid() {
  document.getElementById('auth_section').classList.add('hidden');
  document.getElementById('not_paid_section').classList.remove('hidden');
  document.getElementById('admin_panel').classList.add('hidden');
}

function logout() {
  localStorage.clear();
  location.reload();
}

async function addBulkQuestions() {
  const btn = document.getElementById('bulk_btn');
  const title = document.getElementById('quiz_title').value.trim();
  const raw = document.getElementById('bulk_questions').value.trim();

  if (!title ||!raw) {
    showBulkMsg('Fill title and questions', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerText = 'Uploading...';

  try {
    const blocks = raw.split('---').map(b => b.trim()).filter(b => b);
    const questions = blocks.map(block => {
      const lines = block.split('\n').map(l => l.trim()).filter(l => l);
      const question = lines[0];
      const option_a = lines[1]?.replace(/^A\.?\s*/i, '');
      const option_b = lines[2]?.replace(/^B\.?\s*/i, '');
      const option_c = lines[3]?.replace(/^C\.?\s*/i, '');
      const option_d = lines[4]?.replace(/^D\.?\s*/i, '');
      const correct_answer = lines[5]?.replace(/^Answer:?\s*/i, '').toUpperCase();

      return { title, question, option_a, option_b, option_c, option_d, correct_answer };
    });

    const res = await fetch(`${CONFIG.API_URL}/admin/add_questions_bulk`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: USER_ID, questions })
    });

    const data = await res.json();
    showBulkMsg(data.message || data.error, res.ok? 'success' : 'error');

    if (res.ok) {
      document.getElementById('bulk_questions').value = '';
    }
  } catch (err) {
    showBulkMsg('Failed to upload questions', 'error');
  }

  btn.disabled = false;
  btn.innerText = 'Add All Questions';
}

function showAuthMessage(msg, type) {
  document.getElementById('auth_message').innerHTML = `<p class="${type}">${msg}</p>`;
}
function showBulkMsg(msg, type) {
  document.getElementById('bulk_msg').innerHTML = `<p class="${type}">${msg}</p>`;
}
</script>
</body>
</html>
