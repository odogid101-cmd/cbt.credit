<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Monitor</title>
<style>
body { background:#064e3b; color:#ecfdf5; font-family:system-ui; padding:20px; }
.card { max-width:1000px; margin:20px auto; background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px); padding:30px; border-radius:20px; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { padding:12px; border-bottom:1px solid rgba(110,231,183,0.3); text-align:left; }
button { padding:8px 16px; border-radius:10px; border:none; background:#10b981;
  color:white; cursor:pointer; }
img { max-width:150px; border-radius:10px; cursor:pointer; }
input { padding:10px; margin:5px; border-radius:10px; border:1px solid rgba(110,231,183,0.3);
  background:rgba(16,185,129,0.15); color:white; }
.msg { margin-top:10px; text-align:center; }
.hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <h2>Pending Bank Transfers</h2>
  <input type="password" id="admin_pass" placeholder="Admin Password">
  <button onclick="loadPending()">Load Pending Payments</button>

  <table id="table" class="hidden">
    <thead>
      <tr><th>User ID</th><th>Username</th><th>Email</th><th>Receipt</th><th>Date</th><th>Action</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="msg" class="msg"></div>
</div>

<script src="configQuiz.js"></script>
<script>
async function loadPending() {
  const admin_pass = document.getElementById('admin_pass').value;
  if (!admin_pass) return showMsg('Enter admin password', 'error');

  try {
    const res = await fetch(`${CONFIG.API_URL}/admin/pending_payments?admin_password=${admin_pass}`);
    const data = await res.json();

    if (res.ok) {
      document.getElementById('table').classList.remove('hidden');
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">No pending payments</td></tr>';
      }
      data.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.user_id}</td>
            <td>${p.username}</td>
            <td>${p.email}</td>
            <td><img src="${p.receipt_url}" onclick="window.open('${p.receipt_url}')"></td>
            <td>${new Date(p.created_at).toLocaleDateString()}</td>
            <td><button onclick="verifyPayment(${p.user_id})">Verify Payment</button></td>
          </tr>
        `;
      });
    } else {
      showMsg(data.error, 'error');
    }
  } catch (err) {
    showMsg('Failed to load payments', 'error');
  }
}

async function verifyPayment(user_id) {
  const admin_pass = document.getElementById('admin_pass').value;
  try {
    const res = await fetch(`${CONFIG.API_URL}/admin/verify_payment`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id, admin_password: admin_pass})
    });
    const data = await res.json();
    showMsg(data.message || data.error, res.ok? 'success' : 'error');
    if (res.ok) loadPending();
  } catch (err) {
    showMsg('Verification failed', 'error');
  }
}

function showMsg(text, type) {
  document.getElementById('msg').textContent = text;
  document.getElementById('msg').style.color = type === 'error'? '#fca5a5' : '#6ee7b7';
}
</script>
</body>
</html>
