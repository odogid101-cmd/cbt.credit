<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Result - CBT Credit</title>
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="result.css">
</head>
<body class="">
  <!-- HEADER -->
  <div class="header">
    <div class="circle3" onclick="location.href='home.html'">
      <img src="https://i.postimg.cc/KYJMWhQw/1000324996-removebg-preview.png" alt="Back">
    </div>
    <div class="title">Exam Result</div>
  </div>

  <!-- SCORE CARD -->
  <section class="section">
    <div class="score-card">
      <div class="score-circle">
        <svg class="score-svg" viewBox="0 0 120 120">
          <circle class="score-bg" cx="60" cy="60" r="54"/>
          <circle class="score-progress" id="scoreProgress" cx="60" cy="60" r="54"/>
        </svg>
        <div class="score-text">
          <div class="score-percent" id="scorePercent">0%</div>
          <div class="score-label">Score</div>
        </div>
      </div>

      <h2 id="resultTitle">Loading...</h2>

      <div class="score-stats">
        <div class="stat-item">
          <div class="stat-value" id="correctCount">0</div>
          <div class="stat-label">Correct</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="wrongCount">0</div>
          <div class="stat-label">Wrong</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="unansweredCount">0</div>
          <div class="stat-label">Unanswered</div>
        </div>
      </div>

      <div class="score-info">
        <div class="info-row">
          <span>Time Spent:</span>
          <span id="timeSpent">00:00:00</span>
        </div>
        <div class="info-row">
          <span>Total Questions:</span>
          <span id="totalQuestions">0</span>
        </div>
      </div>
    </div>
  </section>

  <!-- REVIEW SECTION -->
  <section class="section">
    <h2>Review Answers</h2>
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="correct">Correct</button>
      <button class="filter-btn" data-filter="wrong">Wrong</button>
      <button class="filter-btn" data-filter="unanswered">Unanswered</button>
    </div>
    <div class="review-list" id="reviewList"></div>
  </section>

  <!-- BOTTOM ACTIONS -->
  <div class="result-actions">
    <button class="btn btn-secondary" id="homeBtn">Back to Home</button>
    <button class="btn" onclick="location.href='home.html'">Retry Exam</button>
  </div>

  <script src="result.js"></script>
</body>
</html>
